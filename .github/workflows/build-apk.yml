name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install buildozer and cython
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Setup Android SDK and Build Tools
      run: |
        # Create standard Android SDK directories
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools
        
        # Download and set up Android command-line tools if not present
        if [ ! -d "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest" ]; then
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          rm commandlinetools.zip
        fi

        # Create symlink for buildozer to find sdkmanager in old path
        rm -rf ~/.buildozer/android/platform/android-sdk/tools/bin
        ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin ~/.buildozer/android/platform/android-sdk/tools/bin

        # Clear 37 tools block
        rm -rf ~/.buildozer/android/platform/android-sdk/build-tools/37*
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0

        # Accept licenses
        mkdir -p ~/.android
        echo "### License accepted by buildozer" > ~/.android/repositories.cfg
        export ACCEPT_LICENSE="yes"

    - name: Build APK and Save Logs
      run: |
        buildozer --version
        buildozer -v android debug > build_log.txt 2>&1 || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: silambam-apk
        path: bin/*.apk

    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build_log.txt
