name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install buildozer and cython
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Setup Environment Variables for SDK/NDK
      run: |
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.3.13750724" >> $GITHUB_ENV
        
        # Accept Android SDK licenses automatically
        mkdir -p /usr/local/lib/android/sdk/licenses
        echo "24333f8a63b6825ea3c5554f817596b4f8d3d923" > /usr/local/lib/android/sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> /usr/local/lib/android/sdk/licenses/android-sdk-license

    - name: Build APK and Save Logs
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH="$JAVA_HOME/bin:$PATH"
        
        buildozer --version
        buildozer -v android debug > build_log.txt 2>&1 || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: silambam-apk
        path: bin/*.apk

    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build_log.txt
