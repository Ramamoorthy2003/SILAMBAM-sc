name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev lld wget

    - name: Install buildozer and cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer
        pip install "cython<3.0.0"
        pip install "python-for-android<2024.1.0"

    - name: Setup Android SDK, Command-line Tools & Licenses (Fix)
      run: |
        SDK_DIR="/home/runner/buildozer/android/platform/android-sdk"
        mkdir -p $SDK_DIR/licenses

        # 1. Pre-accept Android SDK Licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fb8" > $SDK_DIR/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a648ab" >> $SDK_DIR/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_DIR/licenses/android-sdk-preview-license

        # 2. Download and Setup Android Command-line Tools manually to satisfy p4a path check
        echo "Downloading Android Command-line Tools..."
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        mkdir -p temp_tools
        unzip -q cmdtools.zip -d temp_tools
        mkdir -p $SDK_DIR/cmdline-tools/latest
        cp -r temp_tools/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/

        # 3. Create the legacy tools/bin path expected by python-for-android
        mkdir -p $SDK_DIR/tools/bin
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager

        # Cleanup temporary zip
        rm -rf cmdtools.zip temp_tools

    - name: Set Environment Variables for Buildozer
      run: |
        echo "ANDROIDSDK=/home/runner/buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        echo "ANDROIDNDK=/home/runner/buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV

    - name: Build APK and Save Logs
      run: |
        export JAVA_HOME=$JAVA_HOME
        export PATH="$JAVA_HOME/bin:$PATH"
        buildozer --version
        
        # Build panravan pothu error vanthalum log file-ku output-ah save panra mari set panrom
        buildozer -v android debug > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: silambam-apk
        path: bin/*.apk

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build_log.txt
