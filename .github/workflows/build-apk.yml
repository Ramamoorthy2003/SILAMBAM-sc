name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev lld

    - name: Install buildozer and cython
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Setup Environment Variables & SDK Licenses
      run: |
        # Java path set panrom
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
        
        # Buildozer sariyana default path-ah use panna ungaloda home directory-kula irukkura .buildozer path-ah kudukalam
        # Athu moolama automated-a download aagura tools & licenses strict-a apply aagum
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $SDK_DIR/licenses
        
        echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
        
        # Android SDK Licenses-ah pre-accept panrom (iduthan ungaloda error-ah fix pannum)
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fb8" > $SDK_DIR/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a648ab" >> $SDK_DIR/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_DIR/licenses/android-sdk-preview-license

    - name: Build APK and Save Logs
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH="$JAVA_HOME/bin:$PATH"
        
        buildozer --version
        
        # Build panravan pothu error vanthalum log file-ku output-ah save panra mari set panrom
        buildozer -v android debug > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: silambam-apk
        path: bin/*.apk

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build_log.txt
